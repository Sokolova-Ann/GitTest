<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комната просмотра</title>
    <style>
        :root { --primary: #C8A2C8; --bg: #1a1a1a; --panel: #2a2a2a; --text: #fff; }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); color: var(--text); overflow: hidden; }
        .navbar { background: #000; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        .navbar-brand { font-weight: 700; color: var(--primary); font-size: 1.2rem; text-decoration: none; }
        .container { display: flex; height: calc(100vh - 50px); }
        .video-col { flex: 3; display: flex; flex-direction: column; background: #000; position: relative; }
        
        video { width: 100%; height: 100%; background: #000; }
        .video-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: #aaa; flex-direction: column; }
        
        .reactions-panel { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 10px; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 30px; }
        .reactions-panel button { background: none; border: none; font-size: 1.5rem; cursor: pointer; transition: transform 0.2s; }
        .reactions-panel button:hover { transform: scale(1.3); }
        
        .floating-emoji { position: absolute; bottom: 80px; font-size: 3rem; animation: floatUp 2s ease-out forwards; pointer-events: none; z-index: 100; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-200px) scale(1.5); } }

        .sidebar { flex: 1; background: var(--panel); display: flex; flex-direction: column; border-left: 1px solid #333; min-width: 300px; max-width: 400px; }
        .tabs { display: flex; background: #111; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: bold; color: #aaa; border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); background: var(--panel); }
        
        .tab-content { display: none; flex-direction: column; height: 100%; }
        .tab-content.active { display: flex; }

        .chat-messages { flex-grow: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { background: #333; padding: 8px 12px; border-radius: 10px; max-width: 85%; width: fit-content; font-size: 0.9rem; }
        .message-own { background: var(--primary); margin-left: auto; }
        .msg-author { font-size: 0.75rem; font-weight: bold; opacity: 0.7; margin-bottom: 2px; }
        .chat-input { display: flex; padding: 10px; border-top: 1px solid #444; }
        .chat-input input { flex: 1; padding: 10px; border: none; border-radius: 6px; outline: none; background: #444; color: #fff; }
        .chat-input button { background: var(--primary); color: #fff; border: none; padding: 10px 15px; margin-left: 10px; border-radius: 6px; cursor: pointer; }

        .poll-container { padding: 20px; overflow-y: auto; }
        .poll-title { font-size: 1.2rem; margin-bottom: 15px; text-align: center; }
        .poll-option { background: #333; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.2s; }
        .poll-option:hover { background: #444; }
        .poll-option.voted { border: 1px solid var(--primary); background: rgba(229, 9, 20, 0.1); }
        .poll-option .votes { background: var(--primary); padding: 2px 8px; border-radius: 12px; font-weight: bold; font-size: 0.8rem; }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid #aaa; color: #aaa; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/">🎬 СмотримВместе</a>
        <div style="display: flex; gap: 10px;">
            <button onclick="copyInviteLink()" class="btn btn-primary" style="font-size: 0.9rem;">🔗 Пригласить</button>
            <a href="/" onclick="saveHistory()" class="btn btn-outline">← Выйти</a>
        </div>
    </nav>

    <div class="container">
        <div class="video-col" id="video-col">
            <div id="player-container" class="video-placeholder">
                <h2>Ожидание фильма...</h2>
                <p>Создайте голосование или дождитесь организатора.</p>
            </div>
            <div id="reactions-panel" class="reactions-panel hidden">
                <button onclick="sendReaction('😂')">😂</button>
                <button onclick="sendReaction('😍')">😍</button>
                <button onclick="sendReaction('🔥')">🔥</button>
                <button onclick="sendReaction('😱')">😱</button>
                <button onclick="sendReaction('👍')">👍</button>
            </div>
        </div>

        <div class="sidebar">
            <div class="tabs">
                <div id="tab-chat" class="tab active" onclick="switchSidebarTab('chat')">Чат</div>
                <div id="tab-vote" class="tab" onclick="switchSidebarTab('vote')">Голосование</div>
            </div>
            
            <div id="content-chat" class="tab-content active">
                <div class="chat-messages" id="chat-box"></div>
                <div class="chat-input">
                    <input type="text" id="chat-input" placeholder="Сообщение...">
                    <button onclick="sendMessage()">➤</button>
                </div>
            </div>

            <div id="content-vote" class="tab-content">
                <div class="poll-container" id="poll-container">
                    <p style="text-align: center; color: #aaa;">Голосование не запущено.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = "http://127.0.0.1:8000";
        const WS_API = "ws://127.0.0.1:8002";
        const roomCode = window.location.pathname.split('/').pop();
        const currentUserId = localStorage.getItem('user_id');
        const currentEmail = localStorage.getItem('email');
        
        let roomId = null;
        let roomOwnerId = null;
        let currentFilmId = null;
        let ws = null;
        let videoEl = null;
        let isRemoteAction = false;
        let hasVoted = false;

        if (!currentUserId) { window.location.href = "/"; }

        async function initRoom() {
            const res = await fetch(`${API}/rooms/rooms/${roomCode}`);
            if (!res.ok) { alert("Комната не найдена"); window.location.href = "/"; return; }
            const room = await res.json();
            
            roomId = room.id || room._id;
            roomOwnerId = room.owner_id;
            currentFilmId = room.film_id;
            
            if (!room.film_id) {
                switchSidebarTab('vote');
                if (currentUserId === roomOwnerId) showPollCreator();
                else loadPoll();
            } else {
                loadPlayer(room.film_id, room.position_sec, room.is_playing);
            }

            connectWebSocket();
            loadChatHistory();
        }

        async function loadPlayer(filmId, position, isPlaying) {
            if (videoEl) videoEl.remove();
            document.getElementById('player-container').innerHTML = '';
            document.getElementById('player-container').className = 'video-col';
            
            videoEl = document.createElement('video');
            videoEl.src = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"; 
            videoEl.controls = true;
            videoEl.currentTime = position || 0;
            
            document.getElementById('player-container').appendChild(videoEl);
            document.getElementById('reactions-panel').classList.remove('hidden');

            if (isPlaying) videoEl.play();

            videoEl.addEventListener('play', () => { if(!isRemoteAction) sendSync(true, videoEl.currentTime); });
            videoEl.addEventListener('pause', () => { if(!isRemoteAction) sendSync(false, videoEl.currentTime); });
            videoEl.addEventListener('seeked', () => { if(!isRemoteAction) sendSync(videoEl.paused, videoEl.currentTime); });
            
            setInterval(() => { if(videoEl && !videoEl.paused) sendSync(true, videoEl.currentTime, true); }, 5000);
        }

        function sendSync(isPlaying, position, silent = false) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "sync", is_playing: isPlaying, position: position, silent: silent }));
            }
        }

        function sendReaction(emoji) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: "reaction", emoji: emoji }));
                showFloatingEmoji(emoji);
            }
        }
        function showFloatingEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;
            el.style.left = Math.random() * 80 + 10 + '%';
            document.getElementById('video-col').appendChild(el);
            setTimeout(() => el.remove(), 2000);
        }

        function showPollCreator() {
            const container = document.getElementById('poll-container');
            container.innerHTML = `
                <h3 class="poll-title">Создать голосование</h3>
                <p style="font-size: 0.9rem; margin-bottom: 10px; color: #aaa;">Выберите 2-3 фильма:</p>
                <div id="poll-films-list" style="margin-bottom: 15px;"></div>
                <button class="btn btn-primary" style="width: 100%;" onclick="startPoll()">Запустить</button>
            `;
            fetch(`${API}/catalog/films`).then(r=>r.json()).then(films => {
                document.getElementById('poll-films-list').innerHTML = films.map(f => `
                    <label style="display: block; margin-bottom: 5px;">
                        <input type="checkbox" value="${f._id || f.id}" class="poll-checkbox"> ${f.title}
                    </label>
                `).join('');
            });
        }

        async function startPoll() {
            const checked = Array.from(document.querySelectorAll('.poll-checkbox:checked')).map(cb => cb.value);
            if (checked.length < 2) return alert("Выберите минимум 2 фильма");
            
            // Склеиваем query параметры
            const query = checked.map(id => `film_ids=${id}`).join('&');
            await fetch(`${API}/rooms/rooms/${roomId}/poll?${query}`, { method: 'POST' });
        }

        async function loadPoll() {
            const res = await fetch(`${API}/rooms/rooms/${roomId}/poll`);
            const poll = await res.json();
            if (!poll) {
                document.getElementById('poll-container').innerHTML = '<p style="text-align: center; color: #aaa;">Ожидание создания голосования организатором...</p>';
                return;
            }
            
            document.getElementById('poll-container').innerHTML = `
                <h3 class="poll-title">Голосование за фильм</h3>
                <div id="poll-options"></div>
                ${currentUserId === roomOwnerId ? `<button class="btn btn-outline" style="width:100%; margin-top:15px;" onclick="finishPoll('${poll.id}')">Завершить и выбрать победителя</button>` : ''}
            `;
            
            renderPollOptions(poll.options, poll.id);
        }

        function renderPollOptions(options, pollId) {
            const list = document.getElementById('poll-options');
            if (!list) return;
            list.innerHTML = options.map(o => `
                <div class="poll-option ${hasVoted ? 'voted' : ''}" onclick="${hasVoted ? '' : `vote('${pollId}', '${o.id}')`}">
                    <span>${o.film_title}</span>
                    <span class="votes">${o.votes} голосов</span>
                </div>
            `).join('');
        }

        async function vote(pollId, optionId) {
            hasVoted = true;
            await fetch(`${API}/polls/${pollId}/vote/${optionId}?room_id=${roomId}`, { method: 'POST' });
        }

        async function finishPoll(pollId) {
            await fetch(`${API}/polls/${pollId}/finish?room_id=${roomId}`, { method: 'POST' });
        }

        function connectWebSocket() {
            ws = new WebSocket(`${WS_API}/rooms/${roomId}/ws?user_id=${currentUserId}&email=${encodeURIComponent(currentEmail)}`);
            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                
                if (data.type === "sync") {
                    if (data.silent || !videoEl) return;
                    isRemoteAction = true;
                    videoEl.currentTime = data.position;
                    if (data.is_playing && videoEl.paused) videoEl.play();
                    if (!data.is_playing && !videoEl.paused) videoEl.pause();
                    setTimeout(() => isRemoteAction = false, 500);
                }
                else if (data.type === "reaction") {
                    showFloatingEmoji(data.emoji);
                }
                else if (data.type === "chat") {
                    appendMessage(data);
                }
                else if (data.type === "poll_created" || data.type === "poll_update") {
                    loadPoll();
                }
                else if (data.type === "poll_finished") {
                    alert(`Голосование завершено! Победил фильм: ${data.winner_title}`);
                    loadPlayer(data.winner_film_id, 0, false);
                    switchSidebarTab('chat');
                }
            };
        }

        function switchSidebarTab(tab) {
            document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
            document.getElementById('tab-vote').classList.toggle('active', tab === 'vote');
            document.getElementById('content-chat').classList.toggle('active', tab === 'chat');
            document.getElementById('content-vote').classList.toggle('active', tab === 'vote');
        }

        async function loadChatHistory() {
            const res = await fetch(`${API}/rooms/rooms/${roomId}/chat`);
            const msgs = await res.json();
            document.getElementById('chat-box').innerHTML = '';
            msgs.forEach(appendMessage);
        }

        function appendMessage(msg) {
            const box = document.getElementById('chat-box');
            const isOwn = msg.user_id === currentUserId;
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${isOwn ? 'message-own' : ''}`;
            
            const author = document.createElement('div');
            author.className = 'msg-author';
            author.textContent = msg.email;
            
            const body = document.createElement('div');
            body.textContent = msg.message;
            
            bubble.appendChild(author);
            bubble.appendChild(body);
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(text);
            input.value = '';
        }

        document.getElementById('chat-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.href).then(() => alert("Ссылка скопирована!"));
        }

        async function saveHistory() {
            if (!currentFilmId || !videoEl) return window.location.href = "/";
            await fetch(`${API}/rooms/rooms/${roomId}/history?user_id=${currentUserId}`, { method: 'POST' });
            window.location.href = "/";
        }

        initRoom();
    </script>
</body>
</html>
