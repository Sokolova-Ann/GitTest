{% extends "home.html" %}

{% block todo_container %}
<main class="container">

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/todo">
        <div class="input-group mb-3">
            <input type="text"
                   name="item"
                   value="{{ item | default('') }}"
                   class="form-control"
                   placeholder="Введите новую задачу"
                   aria-label="Добавить"
                   required
                   minlength="1"
                   maxlength="200">
            <button class="btn btn-outline-primary"
                    type="submit">
                Добавить
            </button>
        </div>
    </form>

    {% if todo %}
        <article class="card container-fluid mt-3 p-3">
            <h4>Todo ID: {{ todo.id }}</h4>
            <p><strong>Item:</strong> {{ todo.item }}</p>
        </article>
    {% else %}
        <section class="container-fluid mt-3">
            <h2 align="center">Todos</h2>
            <hr>
            <div class="card">
                <ul class="list-group list-group-flush">
                    {% for todo in todos %}
                        <li class="list-group-item">
                            {{ loop.index }}.
                            <a href="/todo/{{ loop.index }}">
                                {{ todo.item }}
                            </a>
                        </li>
                    {% endfor %}
                </ul>
            </div>
        </section>
    {% endif %}

</main>
{% endblock %}
