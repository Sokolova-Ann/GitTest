<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мои задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        
        <!-- Шапка с пользователем -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Задачи <small class="text-muted fs-6">{{ user }}</small></h1>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Выйти</a>
        </div>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/todo" class="input-group mb-4">
            <input type="text" name="item" class="form-control" placeholder="Новая задача..." required>
            <button class="btn btn-primary" type="submit">Добавить</button>
        </form>

        <ul class="list-group">
            {% for t in todos %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>{{ t.item }}</span>
                    <form method="post" action="/todo/{{ t.id }}/delete" style="margin: 0;">
                        <button class="btn btn-sm btn-danger" type="submit">✕</button>
                    </form>
                </li>
            {% else %}
                <li class="list-group-item text-center text-muted">У вас пока нет задач</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
