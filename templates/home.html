<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Моё Todo-приложение (Иванов И.И.)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: #ffffff;
            color: #222;
            margin: 0;
            padding: 0;
        }
        header {
            background: #FFB6C1;
            color: #696969;
            padding: 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 22px; }
        .container {
            max-width: 720px;
            margin: 30px auto;
            padding: 0 16px;
        }
        form { display: flex; gap: 8px; margin-bottom: 20px; }
        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        button {
            padding: 10px 18px;
            background: #FFB6C1;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        button:hover { background: #FFB6C1; }
        h2 { text-align: center; color: #555; }
        ul {
            list-style: none;
            padding: 0;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        li {
            padding: 12px 16px;
            border-bottom: 1px solid #000;
        }
        li:last-child { border-bottom: none; }
        li a {
            color: #2c3e50;
            text-decoration: none;
            margin-left: 6px;
        }
        li a:hover { text-decoration: underline; }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            padding: 20px;
        }
        .empty {
            text-align: center;
            color: #888;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Todo-приложение - разработчик Соколова А.В.</h1>
    </header>

    {% block todo_container %}{% endblock %}
</body>
</html>
