<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в админку</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="card p-4 shadow-sm" style="width: 320px;">
        <h4 class="text-center mb-3">Админ-панель</h4>
        {% if error %}<div class="alert alert-danger p-2">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
            <div class="mb-2">
                <label>Email</label>
                <input type="email" name="email" class="form-control" value="admin@test.com" required>
            </div>
            <div class="mb-3">
                <label>Пароль</label>
                <input type="password" name="password" class="form-control" value="admin123" required>
            </div>
            <button class="btn btn-primary w-100">Войти</button>
        </form>
        <a href="/" class="d-block text-center mt-3 text-muted">← На главную</a>
    </div>
</body>
</html>
